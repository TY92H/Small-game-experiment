const Render={renderer:null,last:0,frame:0,init(){this.renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));this.renderer.setSize(1280,720);this.renderer.shadowMap.enabled=true;this.renderer.shadowMap.type=T.PCFSoftShadowMap;this.renderer.outputEncoding=T.sRGBEncoding;this.renderer.toneMapping=T.ACESFilmicToneMapping;this.renderer.toneMappingExposure=1;$('scene').appendChild(this.renderer.domElement);this.renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();Save.write();log('画面暂时中断，进度已保存。刷新页面即可继续。');});},reflection(){if(GameState.inside||dist(GameState.pos,{x:95,z:40})>150||this.frame%8!==0)return;const camera=World.reflectCamera,c=Camera.obj,p=c.position.clone();p.y=.8-p.y;const target=c.position.clone().add(c.getWorldDirection(new T.Vector3()));target.y=.8-target.y;camera.position.copy(p);camera.up.set(0,-1,0);camera.projectionMatrix.copy(c.projectionMatrix);camera.lookAt(target);camera.updateMatrixWorld();World.reflectionMatrix.set(.5,0,0,.5,0,.5,0,.5,0,0,.5,.5,0,0,0,1).multiply(camera.projectionMatrix).multiply(camera.matrixWorldInverse);World.lake.visible=false;this.renderer.setRenderTarget(World.reflection);this.renderer.clippingPlanes=[new T.Plane(new T.Vector3(0,1,0),-.38)];this.renderer.render(World.scene,camera);this.renderer.clippingPlanes=[];this.renderer.setRenderTarget(null);World.lake.visible=true;},loop(now){requestAnimationFrame(t=>this.loop(t));const dt=Math.min((now-this.last)/1000||.016,.05);this.last=now;elapsed+=dt;this.frame++;if(started&&!UI.view&&!World.transitioning){Player.update(dt);Time.advance(dt);NPC.update(dt);saveTimer+=dt;if(saveTimer>10){saveTimer=0;Save.write();}hudTimer+=dt;if(hudTimer>.25){hudTimer=0;Quest.check();UI.hud();}}else if(!started){Player.model.visible=false;World.outside.visible=true;World.room.visible=false;}Camera.update(dt);Weather.update();World.update(dt);Minigame.update(dt);Audio.update(elapsed);if(started&&this.frame%15===0)UI.hud();if(this.frame%30===0){World.sun.target.position.copy(Player.model.position);World.sun.position.x+=Player.model.position.x;World.sun.position.z+=Player.model.position.z;}this.reflection();this.renderer.render(World.scene,Camera.obj);}};
// 按指定顺序加载唯一外部依赖。
const Bootstrap={async load(){const urls=['./three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];for(const src of urls){const ok=await new Promise(resolve=>{const s=document.createElement('script');let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok);};const timer=setTimeout(()=>{s.remove();finish(false);},10000);s.src=src;s.onload=()=>finish(!!window.THREE&&String(window.THREE.REVISION)==='128');s.onerror=()=>{s.remove();finish(false);};document.head.appendChild(s);});if(ok){T=window.THREE;return this.init();}}$('loadtext').textContent='请将 three.min.js 放在 index.html 同目录，或联网后重试';},init(){GameState=Save.read()||fresh();Save.available=!!Save.read();const fit=()=>{$('frame').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1280,innerHeight/720)+')';};fit();window.addEventListener('resize',fit);try{Camera.init();Render.init();World.init();Input.init();$('loading').style.display='none';$('menu').style.display='block';$('continue').style.display=Save.available?'block':'none';requestAnimationFrame(t=>Render.loop(t));window.addEventListener('beforeunload',()=>Save.write());}catch(e){console.error(e);$('loadtext').textContent='画面未能启动，请开启浏览器硬件加速后刷新。';}},enter(isNew){if(isNew){const settings={difficulty:GameState.difficulty,volume:GameState.volume,mute:GameState.mute};GameState=Object.assign(fresh(),settings);for(const a of ANIMALS){const m=NPC.models[a[0]];(a[0]==='cat'?World.room:World.outside).add(m);m.position.set(a[4],a[0]==='cat'?0:Terrain.height(a[4],a[5]),a[5]);}UI.waypoint=null;World.fireworkTime=0;}else if(!started){const saved=Save.read();if(saved)GameState=saved;}started=true;$('menu').style.display='none';$('hud').style.display='block';UI.close();World.sync();Player.sync();NPC.update(0);Audio.init();Audio.apply();UI.hud();Save.write();if(isNew)log('欢迎回家。先走两步，再捡起门前发光的树枝吧。');else log('你的冬天还在这里，慢慢来。');}};
Bootstrap.load();
