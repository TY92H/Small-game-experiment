function dateKey(time=Date.now()){const d=new Date(time);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function blankEvidence(){return{day:dateKey(),jobs:[],coins:{},foods:[],lastFood:null,mealFood:[],tags:[],lastUpgrade:null}}
function cleanEvidence(v){const e=blankEvidence();if(!v||typeof v.day!=='string')return e;e.day=v.day.slice(0,10);e.jobs=(Array.isArray(v.jobs)?v.jobs:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<12);e.foods=(Array.isArray(v.foods)?v.foods:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<16).slice(-200);e.lastFood=e.foods.at(-1)??null;e.mealFood=(Array.isArray(v.mealFood)?v.mealFood:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<25).slice(0,3);e.tags=(Array.isArray(v.tags)?v.tags:[]).filter(s=>typeof s==='string'&&s.length<30).slice(-50);for(const [k,n] of Object.entries(v.coins||{}))if(Number.isInteger(+k)&&+k>=0&&+k<8&&Number.isFinite(n)&&n>=0)e.coins[k]=n;e.lastUpgrade=Number.isInteger(v.lastUpgrade)?v.lastUpgrade:null;return e}
function evidence(){if(state.evidence.day!==dateKey()){state.evidence=blankEvidence();state.evidence.tags.push('newday');const i=pigBuilding(tutuId());if(i>=0)state.evidence.jobs.push(i);state.pendingJobs=[];queueMicrotask(()=>releaseDiary('day',true));}return state.evidence}
function mark(tag){const e=evidence();if(!e.tags.includes(tag))e.tags.push(tag)}
function recordJob(job){const e=evidence();if(!e.jobs.includes(job)){e.jobs.push(job);state.pendingJobs.push({job,at:state.playMs+4500})}}
function diaryEligible(d,e=evidence()){if(d.job!==undefined&&!e.jobs.includes(d.job))return false;if(d.need==='coins'&&!(e.coins[d.job]>0))return false;if(d.need==='food'&&!e.foods.length)return false;if(d.need==='nature'&&!['butterfly','dragonfly','cloud'].some(x=>e.tags.includes(x)))return false;if(d.food!==undefined&&!e.foods.includes(d.food))return false;if(d.tag&&!e.tags.includes(d.tag))return false;return true}
function releaseDiary(reason='random',force=false,job=null){
 const e=evidence();if(!force&&state.diary.length&&Date.now()-state.diary.at(-1).at<15000)return null;
 let pool=DIARIES.filter(d=>diaryEligible(d,e));if(job!==null){const local=pool.filter(d=>d.job===job);if(local.length)pool=local;}
 else if(reason==='return'){const freshJobs=pool.filter(d=>d.job!==undefined&&!state.diaryUsed[d.id]);if(freshJobs.length)pool=freshJobs;else if(!state.diaryUsed[DIARIES.find(d=>d.tag==='return').id])pool=pool.filter(d=>d.tag==='return')}
 else if(reason==='meal')pool=pool.filter(d=>d.tag==='cafEat');
 else if(reason==='first')pool=pool.filter(d=>d.tag==='first');
 else if(reason==='day')pool=pool.filter(d=>d.tag==='newday');
 if(!pool.length)return null;const min=Math.min(...pool.map(d=>state.diaryUsed[d.id]||0));pool=pool.filter(d=>(state.diaryUsed[d.id]||0)===min);
 if(job!==null&&min===0&&pool.some(d=>d.arrival))pool=pool.filter(d=>d.arrival);
 const d=pool[Math.floor(Math.random()*pool.length)],vars={job:d.job!==undefined?JOB_NAMES[d.job]:'农场',coins:fmt(e.coins[d.job]||0),food:FLAVORS[e.lastFood??0].name,meal:e.mealFood.map(id=>RECIPES[id].name).join('、'),sighting:e.tags.includes('dragonfly')?'一只小蜻蜓':e.tags.includes('butterfly')?'一只蝴蝶':'慢慢飘的白云'};
 let body=d.body.replace(/\{(job|coins|food|meal|sighting)\}/g,(_,k)=>vars[k]);
 const extra=['这一页写完，我轻轻拍了拍本子。','今天的小事，我想多记一会儿。','写到这里，我的耳朵又动了一下。','我在最后画了一颗小小的心。','这次我把字写得圆了一点。','日记本乖乖的，一直听我说话。','我把这一页压平，明天再来写。','今天也有一点点值得记住。'];
 if(min>0){body+=extra[(min-1)%extra.length];if(state.diary.at(-1)?.body===body)body=d.body.replace(/\{(job|coins|food|meal|sighting)\}/g,(_,k)=>vars[k])+extra[min%extra.length]}
 if(state.diary.some(e=>e.body===body)){const today=new Date();body=d.body.replace(/\{(job|coins|food|meal|sighting)\}/g,(_,k)=>vars[k])+'我在页角写下'+(today.getMonth()+1)+'月'+today.getDate()+'日，这是我的第'+(state.diarySeq+1)+'篇日记。'}
 const entry={id:++state.diarySeq,template:d.id,title:d.title,body,at:Date.now(),read:false,job:d.job??null};state.diaryUsed[d.id]=(state.diaryUsed[d.id]||0)+1;state.diary.push(entry);updateDiaryDot();save();return entry;
}
function updateDiaryDot(){const unread=state.diary.filter(d=>!d.read).length;$('#diaryDot').classList.toggle('hidden',!unread);$('#brandPig').setAttribute('aria-label','图图日记'+(unread?'，有 '+unread+' 篇新日记':''))}
function diaryDate(at){return new Date(at).toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}

/* Meal trips use real elapsed time and a FIFO event simulation, including while the file is closed. */
function validateCanteen(c,s){
 const num=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<1e15,integer=(n,a,b)=>Number.isInteger(n)&&n>=a&&n<=b,point=p=>p&&typeof p==='object'&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=-100&&p.x<=900&&p.y>=0&&p.y<=900;
 if(!c||!integer(c.level,1,15)||!Array.isArray(c.staff)||c.staff.length!==4||!Array.isArray(c.selected)||c.selected.length!==3||!Array.isArray(c.nextCall)||c.nextCall.length!==2||c.nextCall.some(t=>!num(t))||!num(c.clock)||!integer(c.nextOrder,1,1e12)||!num(c.servedCount))throw Error('食堂存档不完整。');
 const occupied=s.buildings.flatMap(b=>b.pigs),staff=c.staff.filter(id=>id!==null);
 if(new Set(staff).size!==staff.length||staff.some(id=>!s.pigs.includes(id)||occupied.includes(id)||s.away[id]))throw Error('食堂服务小猪重复或不可用。');
 if(c.selected.some((id,k)=>!RECIPES[id]||RECIPES[id].category!==MENU_CATEGORIES[k]||RECIPES[id].level>c.level))throw Error('今天供应的菜谱尚未解锁。');
 const clean={level:c.level,staff:[...c.staff],selected:[...c.selected],nextCall:[...c.nextCall],nextOrder:c.nextOrder,clock:c.clock,servedCount:c.servedCount,meals:{}},seats=new Set(),orders=new Set();
 if(!c.meals||typeof c.meals!=='object'||Array.isArray(c.meals)||Object.keys(c.meals).length>24)throw Error('用餐队伍数据无效。');
 for(const [key,m] of Object.entries(c.meals)){const id=+key;if(!m||m.id!==id||!s.pigs.includes(id)||s.away[id]||staff.includes(id)||!MEAL_PHASES.includes(m.phase)||!integer(m.originJob,-1,7)||!integer(m.originRegion,0,1)||!s.regions.includes(m.originRegion)||!integer(m.seat,0,23)||!integer(m.order,1,c.nextOrder-1)||orders.has(m.order)||!num(m.start))throw Error('用餐小猪数据无效。');
  const current=s.buildings.findIndex(b=>b.pigs.includes(id));if(current!==m.originJob||current>=0&&Math.floor(current/4)!==m.originRegion)throw Error('用餐小猪的原工位没有正确保留。');orders.add(m.order);
  if(!['leave','return'].includes(m.phase)){if(seats.has(m.seat))throw Error('两只小猪不能预留同一张椅子。');seats.add(m.seat)}
  if(WAIT_PHASES.includes(m.phase)){if(m.end!==null)throw Error('排队状态无效。')}else if(!num(m.end)||m.end<m.start||m.end-m.start>(m.phase==='eat'?MEAL_MS:120000)+1)throw Error('用餐计时无效。');
  if(m.phase==='eat'&&m.end-m.start!==MEAL_MS)throw Error('入座后的吃饭时间应为三分钟。');
  if(!Array.isArray(m.route)||m.route.length<1||m.route.length>12||m.route.some(p=>!point(p))||!Array.isArray(m.food)||m.food.length!==3||m.food.some((r,k)=>r!==null&&(!RECIPES[r]||RECIPES[r].category!==MENU_CATEGORIES[k]||RECIPES[r].level>c.level)))throw Error('餐盘或行走路线无效。');
  if(['toSeat','eat','leave','return'].includes(m.phase)&&m.food.some(r=>r===null))throw Error('餐盘还没有领齐。');
  clean.meals[id]={id,originJob:m.originJob,originRegion:m.originRegion,seat:m.seat,order:m.order,phase:m.phase,start:m.start,end:m.end,route:m.route.map(p=>({x:p.x,y:p.y})),food:[...m.food],qFrom:point(m.qFrom)?{x:m.qFrom.x,y:m.qFrom.y}:m.route.at(-1),qTo:point(m.qTo)?{x:m.qTo.x,y:m.qTo.y}:m.route.at(-1),qAt:num(m.qAt)?m.qAt:m.start};
 }
 for(let k=0;k<3;k++)if(Object.values(clean.meals).filter(m=>[APPROACH_PHASES[k],SERVE_PHASES[k]].includes(m.phase)).length>1)throw Error('同一窗口不能同时服务两只小猪。');

}
function motionAlong(route,progress){if(route.length===1)return{...route[0]};const lengths=route.slice(1).map((p,i)=>Math.hypot(p.x-route[i].x,p.y-route[i].y)),total=lengths.reduce((a,b)=>a+b,0);if(total<.01)return{...route.at(-1)};let left=clamp(progress,0,1)*total;for(let i=0;i<lengths.length;i++){if(left<=lengths[i]||i===lengths.length-1){const f=lengths[i]===0?1:left/lengths[i];return{x:route[i].x+(route[i+1].x-route[i].x)*f,y:route[i].y+(route[i+1].y-route[i].y)*f}}left-=lengths[i]}return{...route.at(-1)}}
function routeLength(route){return route.slice(1).reduce((n,p,i)=>n+Math.hypot(p.x-route[i].x,p.y-route[i].y),0)}
function mealPose(m,now=Date.now()){
 if(WAIT_PHASES.includes(m.phase)){const t=clamp((now-m.qAt)/1100,0,1);return motionAlong([m.qFrom,m.qTo],t)}
 if(m.phase==='eat'){const s=cafeSeat(m.seat);return{x:s.x,y:s.y}}
 const t=m.end===m.start?1:clamp((now-m.start)/(m.end-m.start),0,1);return motionAlong(m.route,t);
}
function setMealPhase(m,phase,at,route,duration=null){m.phase=phase;m.start=at;m.route=route.map(p=>({x:p.x,y:p.y}));m.end=duration===null?null:at+duration;if(WAIT_PHASES.includes(phase)){m.qFrom={...route.at(-1)};m.qTo={...route.at(-1)};m.qAt=at}}
function mealWalk(m,phase,at,route,speed=90,min=700){setMealPhase(m,phase,at,route,Math.max(min,routeLength(route)/speed*1000))}
function riceQueuePoint(rank){const row=Math.floor(rank/2),col=rank%2;return{x:row%2?(col?590:545):(col?545:590),y:768-row*45}}
function waitingMeals(k){return Object.values(state.canteen.meals).filter(m=>m.phase===WAIT_PHASES[k]||k===0&&m.phase==='enter').sort((a,b)=>a.order-b.order)}
function updateQueues(at){for(let k=0;k<3;k++){const list=waitingMeals(k);list.forEach((m,rank)=>{if(m.phase==='enter')return;const target=k===0?riceQueuePoint(rank):{x:648,y:SERVICE_POINTS[k].y+46+rank*43};if(!m.qTo||Math.hypot(m.qTo.x-target.x,m.qTo.y-target.y)>.1){m.qFrom=mealPose(m,at);m.qTo=target;m.qAt=at}})}}
function pumpCanteen(at){if(!canteenReady())return false;let changed=false;for(let k=0;k<3;k++){const list=Object.values(state.canteen.meals);if(list.some(m=>[APPROACH_PHASES[k],SERVE_PHASES[k]].includes(m.phase)))continue;const waiting=list.filter(m=>m.phase===WAIT_PHASES[k]).sort((a,b)=>a.order-b.order),m=waiting[0];if(!m)continue;

function beginPig(e,id,source){if(e.button!==0||paused||isAway(id)||isDining(id)||feedMode!==null||decorMode!==null||modalType)return;drag={id,source,pointer:e.pointerId,x:e.clientX,y:e.clientY,started:false,ghost:null};try{source.setPointerCapture(e.pointerId)}catch(err){}pressTimer=setTimeout(()=>{if(drag&&!drag.started){suppressClickUntil=Date.now()+700;cancelDrag();showPig(id)}},600)}
function dropSiteAt(x,y){const target=document.elementFromPoint(x,y),actor=target?.closest('[data-map-pig]');if(actor){const i=pigBuilding(+actor.dataset.mapPig);if(i>=0)return $('.site[data-id="'+i+'"]')}return target?.closest('.site')}
function decorHit(p){for(let i=state.decorations.length-1;i>=0;i--){const d=state.decorations[i];if(d.region===activeRegion&&Math.abs(p.x-d.x)<50&&Math.abs(p.y-d.y+12)<40)return i}return -1}
function placeDecor(p){if(activeRegion===2||typeof decorMode!=='number')return;if(!freeGrass(p)){toast('选一块空草地，小猪也能走得开。');return}if(state.decorations.filter(d=>d.region===activeRegion).length>=12){toast('这片草地已经有 12 件装扮啦');return}state.decorations.push({type:decorMode,region:activeRegion,x:p.x,y:p.y});mark('decor');decorMode=null;updateUI();save();sound('place')}
function exportSave(){settleTime();save();const blob=new Blob([JSON.stringify({...state,savedAt:lastTick},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='图图农场-存档-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('小猪和日记的备份已经导出啦')}
function confirmImport(){if(!pendingImport)return;state=pendingImport;pendingImport=null;resetSession();offline(Math.max(0,(Date.now()-state.savedAt)/1000));lastTick=Date.now();storageOK=true;closeSheet();mark('return');releaseDiary('return',true);updateUI(true);save();toast('小猪和日记都回来啦'+(state.migrationRefund?' · 已返还 '+fmt(state.migrationRefund)+' 金币':''))}
function resetSession(){activeRegion=state.region;barnPage=0;selectedPig=null;feedMode=null;decorMode=null;onlyIdle=false;cancelDrag();walkStates.clear();specialStates.clear();actorPos.clear();departures.clear();lastInputPlay=state.playMs;idleRolled=false;idleDiary=false;nextDiaryAt=state.playMs+rnd(100000,190000);visitStarted=state.playMs;teaseUntil=0;advanceCanteen(Date.now());syncGroups()}
function sheetAction(el){if(paused&&el.dataset.action!=='resume')return;const a=el.dataset.action,i=+el.dataset.id,p=+el.dataset.pig;
 if(a==='cafe-menu'){selectMenu(+el.dataset.station,i);return}if(a==='cafe-station'){showCanteenStation(i);return}if(a==='build')doBuild(i);else if(a==='upgrade')doUpgrade(i);else if(a==='pig')showPig(p);else if(a==='choose-worker')showChooseWorker(i);else if(a==='assign'){closeSheet();assignPig(p,i)}else if(a==='swap'){closeSheet();assignPig(p,i,+el.dataset.replace)}else if(a==='invite')buyPig();else if(a==='choose')choosePig(p);else if(a==='rest'){releasePig(p);closeSheet()}else if(a==='cakes')showCakes();else if(a==='visitor')settleVisitor();else if(a==='feed-mode'){feedMode=i;selectedPig=null;decorMode=null;closeSheet();updateUI(true)}else if(a==='rescue')rescuePig(p);else if(a==='claim-offline')claimOffline();else if(a==='offline')showOffline();else if(a==='decor'){decorMode=i;selectedPig=null;feedMode=null;closeSheet();updateUI()}else if(a==='move-decor'){decorMode='move';selectedPig=null;feedMode=null;closeSheet();updateUI()}else if(a==='clear-decor'){state.decorations=state.decorations.filter(d=>d.region!==activeRegion);for(const [id,s] of specialStates)if(s.mode==='swing'&&s.region===activeRegion)specialStates.delete(id);showDecor();save()}else if(a==='sound'){state.sound=!state.sound;if(state.sound){unlockAudio();sound('happy')}showSettings();save()}else if(a==='export')exportSave();else if(a==='import')$('#importFile').click();else if(a==='confirm-import')confirmImport();else if(a==='region')unlockRegion(i);else if(a==='diaries')showDiaryList();else if(a==='diary')showDiary(i);else if(a==='resume')resumeTab();
}
document.addEventListener('pointerdown',e=>{if(!state||paused)return;inputActivity();unlockAudio();const pig=e.target.closest('[data-pig].pig-card,[data-map-pig]');if(pig){beginPig(e,+(pig.dataset.pig??pig.dataset.mapPig),pig);return}if(decorMode==='move'&&!modalType&&e.target.closest('#scene')){const p=screenToWorld(e.clientX,e.clientY),index=decorHit(p);if(index>=0){const d=state.decorations[index];dragDecor={index,original:{x:d.x,y:d.y},offset:{x:p.x-d.x,y:p.y-d.y},pointer:e.pointerId};e.preventDefault()}}}, {passive:false});
document.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.pointer){const d=drag;if(!d.started&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7){clearTimeout(pressTimer);d.started=true;d.source.classList.add('dragging');d.ghost=document.createElement('div');d.ghost.className='drag-ghost';d.ghost.innerHTML=pigSVG(d.id,'happy');document.body.appendChild(d.ghost);$$('.workplace').forEach(el=>el.classList.add('target'))}if(d.started){e.preventDefault();d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';$$('.workplace.hover').forEach(el=>el.classList.remove('hover'));dropSiteAt(e.clientX,e.clientY)?.querySelector('.workplace')?.classList.add('hover')}}else if(dragDecor&&e.pointerId===dragDecor.pointer){e.preventDefault();const p=screenToWorld(e.clientX,e.clientY),d=state.decorations[dragDecor.index];d.x=clamp(p.x-dragDecor.offset.x,30,770);d.y=clamp(p.y-dragDecor.offset.y,155,825)}}, {passive:false});
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointer){const d=drag,started=d.started;clearTimeout(pressTimer);if(started){suppressClickUntil=Date.now()+600;const site=dropSiteAt(e.clientX,e.clientY),target=document.elementFromPoint(e.clientX,e.clientY);cancelDrag();if(site){const i=+site.dataset.id;if(jobOpen(i))assignPig(d.id,i);else showBuilding(i)}else if(target?.closest('.barn'))releasePig(d.id);else{updateUI();toast('把小猪放到建筑上就好。')}}else cancelDrag()}else if(dragDecor&&e.pointerId===dragDecor.pointer){const d=state.decorations[dragDecor.index];suppressClickUntil=Date.now()+400;if(!freeGrass(d)){d.x=dragDecor.original.x;d.y=dragDecor.original.y;toast('这里留给工位，换一小块空草地吧。')}else{mark('decor');save()}dragDecor=null}}, {passive:false});
document.addEventListener('pointercancel',()=>cancelDrag());
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;const el=e.target.closest('button');if(el?.disabled)return;if(el?.dataset.action){sheetAction(el);return}if(paused)return;if(e.detail===0){inputActivity();unlockAudio()}
 if(el?.id==='closeSheet'){closeSheet();return}if(e.target.id==='overlay'){closeSheet();return}if(modalType)return;
 if(el?.id==='mealCall'){callMeal();return}if(el?.id==='noticeBoard'){showCanteenNotice();return}if(el?.hasAttribute('data-cafe-station')){showCanteenStation(+el.dataset.cafeStation);return}if(el?.hasAttribute('data-cafe-upgrade')){upgradeCanteen();return}if(el?.id==='brandPig'){showDiaryList();return}if(el?.id==='settingsBtn'){showSettings();return}if(el?.id==='collectionBtn'){showCollection();return}if(el?.id==='cakeBtn'){showCakes();return}if(el?.id==='decorBtn'){if(activeRegion===2)toast('室内把通道留给小猪，草甸和果园可以自由摆装扮。');else showDecor();return}if(el?.id==='visitor'){showVisitor();return}if(el?.id==='bankPill'){showOffline();return}if(el?.id==='sceneCollect'){collectRegion();return}if(el?.id==='collectAll'){collectAll();return}if(el?.id==='goalButton'){claimGoal();return}if(el?.id==='sceneHint'){cancelModes();return}
 if(el?.id==='prevPig'){barnPage--;renderBarn(true);return}if(el?.id==='nextPig'){barnPage++;renderBarn(true);return}if(el?.id==='filterBtn'){onlyIdle=!onlyIdle;barnPage=0;renderBarn(true);return}
 if(el?.hasAttribute('data-region')){const i=+el.dataset.region;if(!state.regions.includes(i)){showSheet('去蜜桃果园看看','<p class="lead">桃花开了，果园里有四个新岗位。</p><p>蜜桃林场、蒟蒻作坊、果园仓库、果园木屋。解锁时，林场和木屋已经准备好啦。</p><button class="primary" data-action="region" data-id="1" '+(state.coins<1800?'disabled':'')+'>解锁 · 1,800 金币</button>','region')}else{activeRegion=state.region=i;selectedPig=null;feedMode=null;decorMode=null;updateUI(true);save()}return}
 if(el?.hasAttribute('data-invite')){buyPig();return}const pig=el?.closest('[data-pig].pig-card,[data-map-pig]');if(pig){const id=+(pig.dataset.pig??pig.dataset.mapPig);if(feedMode!==null){const r=el.getBoundingClientRect();feedPig(id,r.left+r.width/2,r.top)}else if(selectedPig===id)showPig(id);else choosePig(id);return}
 if(decorMode!==null&&e.target.closest('#scene')){if(typeof decorMode==='number')placeDecor(screenToWorld(e.clientX,e.clientY));return}
 if(el?.hasAttribute('data-upgrade')){doUpgrade(+el.dataset.upgrade);return}if(el?.hasAttribute('data-collect')){collect(+el.dataset.collect);return}if(el?.hasAttribute('data-job-detail')){showBuilding(+el.dataset.jobDetail);return}if(el?.hasAttribute('data-build')){showBuilding(+el.dataset.build);return}
 if(el?.classList.contains('workplace')){const i=+el.dataset.id;if(!jobOpen(i)){showBuilding(i);return}if(selectedPig!==null)assignPig(selectedPig,i);else if(feedMode!==null){if(!occupants(i).length){toast('这个工位还没有小猪，点休息站里的伙伴试试。');return}if(occupants(i).length===1){feedPig(occupants(i)[0],e.clientX,e.clientY)}else{showSheet('喂给哪只小猪？','<div class="job-pigs">'+occupants(i).map(id=>'<button class="job-pig" data-feed-pig="'+id+'">'+pigSVG(id)+'<b>'+pigName(id)+'</b></button>').join('')+'</div>','feed-choice')}}else showBuilding(i)}
});
$('#sheetBody').addEventListener('click',e=>{const b=e.target.closest('[data-feed-pig]');if(b){const r=b.getBoundingClientRect();feedPig(+b.dataset.feedPig,r.left+r.width/2,r.top);closeSheet()}});
document.addEventListener('keydown',e=>{if(!state)return;inputActivity();unlockAudio();if(e.key==='Escape'){modalType?closeSheet():cancelModes()}if(e.key==='Tab'&&modalType){const focus=$$('#overlay button:not(:disabled),#overlay input:not(:disabled)').filter(e=>!e.classList.contains('hidden')),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>6*1024*1024)throw Error('这份文件太大了，请选择导出的农场 JSON 存档。');pendingImport=validateSave(JSON.parse(await file.text()));showSheet('导入这座农场？','<p>这份存档有 '+pendingImport.pigs.length+' 只小猪、'+fmt(pendingImport.coins)+' 金币和 '+pendingImport.diary.length+' 篇日记。</p>'+(pendingImport.migrationRefund?'<p class="save-notice">移除场景的小猪回休息站，场景与建筑投入、未收金币已计入返还：'+fmt(pendingImport.migrationRefund)+' 金币。</p>':'')+'<p>导入会替换当前进度。想保留当前农场，可以先导出一份备份。</p><button class="secondary" data-action="export">先导出当前农场</button><button class="primary" data-action="confirm-import">导入并继续玩</button>','import')}catch(err){pendingImport=null;toast(err.message||'存档没有读成功，请再试一次。')}});
function settleTime(){if(paused||document.hidden)return;const now=Date.now(),dt=Math.max(0,(now-lastTick)/1000);if(dt>15)offline(dt);else{produce(dt);advancePlay(dt*1000)}advanceCanteen(now);lastTick=now}
function tick(){if(paused||document.hidden)return;settleTime();if(!state.visitor&&Date.now()>=state.nextVisit)beginVisit();updateUI();if(Date.now()-lastSave>5000)save()}
function suspend(){cancelDrag();if(paused||wasHidden)return;const now=Date.now(),dt=Math.max(0,(now-lastTick)/1000);if(dt<=15){produce(dt);advancePlay(dt*1000)}else offline(dt);advanceCanteen(now);lastTick=now;save();wasHidden=true}
function resume(){if(!wasHidden||paused)return;offline(Math.max(0,(Date.now()-lastTick)/1000));lastTick=Date.now();wasHidden=false;resetSession();mark('return');releaseDiary('return',true);updateUI(true);save();if(state.pendingOffline>=1)showOffline()}
document.addEventListener('visibilitychange',()=>document.hidden?suspend():resume());window.addEventListener('pagehide',suspend);window.addEventListener('pageshow',resume);window.addEventListener('beforeunload',suspend);
function resumeTab(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw)state=validateSave(JSON.parse(raw));paused=false;resetSession();offline(Math.max(0,(Date.now()-state.savedAt)/1000));lastTick=Date.now();closeSheet();updateUI(true);save()}catch(e){toast('暂时读不到最新进度，回到原来的页面试试。')}}
window.addEventListener('storage',e=>{if(e.key!==SAVE_KEY||!e.newValue)return;try{const v=JSON.parse(e.newValue);if(v.session&&v.session!==sessionId){paused=true;cancelDrag();showSheet('小猪在另一页忙着呢','<p>另一页已经接着经营这座农场。这里先歇一会儿，金币和进度不会重复计算。</p><button class="primary" data-action="resume">在这里继续</button>','paused')}}catch(err){}});
function animate(now){requestAnimationFrame(animate);if(document.hidden||paused||now-lastFrame<32)return;lastFrame=now;time=reduceMotion?0:now/1000;drawWorld(time)}
try{const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('tutu-farm-v3')||localStorage.getItem('tutu-farm-v2')||localStorage.getItem('tutu-farm-v1');hadSave=!!raw;state=raw?validateSave(JSON.parse(raw)):defaultState();if(raw&&JSON.parse(raw).version<4)loadNotice='小猪食堂开门啦，旧农场和日记都在'+(state.migrationRefund?' · 返还 '+fmt(state.migrationRefund)+' 金币':'')}catch(err){state=defaultState();storageOK=false;loadNotice='暂时读不到原存档，可到设置导入备份。'}
resetSession();offline(Math.max(0,(Date.now()-state.savedAt)/1000));lastTick=Date.now();if(hadSave){mark('return');releaseDiary('return',true)}else{mark('first');releaseDiary('first',true)}
updateUI(true);new ResizeObserver(resize).observe($('#scene'));window.addEventListener('resize',resize);resize();save();setInterval(tick,500);requestAnimationFrame(animate);if(loadNotice)setTimeout(()=>toast(loadNotice),450);if(hadSave&&state.pendingOffline>=1)setTimeout(()=>{if(!modalType)showOffline()},350);
